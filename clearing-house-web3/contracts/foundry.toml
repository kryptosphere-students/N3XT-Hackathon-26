[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
# ../node_modules holds @openzeppelin/contracts and forge-std, installed by npm at the monorepo root.
# Listing it in libs lets solc read files outside contracts/.
libs = ["../node_modules"]
solc_version = "0.8.30"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
